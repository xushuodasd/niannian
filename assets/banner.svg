<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-label="念念 niannian — 一个活着的 AI 陪伴体">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0a0c13"/>
      <stop offset="0.55" stop-color="#101522"/>
      <stop offset="1" stop-color="#161c29"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffc978" stop-opacity="0.50"/>
      <stop offset="0.35" stop-color="#f9a95c" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#f9a95c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffaf0" stop-opacity="1"/>
      <stop offset="0.42" stop-color="#ffd79a" stop-opacity="0.80"/>
      <stop offset="1" stop-color="#ffb45f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="1327" y1="216" x2="1327" y2="404" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe7c2" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#ffd08a" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffc978" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd79a" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffd79a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2216" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2b2216" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#191309"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.46" cy="0.42" r="0.8">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="soft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="soft2" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="soft3" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grain" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1600" height="520" fill="url(#night)"/>
  <rect width="1600" height="520" fill="url(#grain)"/>

  <!-- 远处的光斑（城市/夜灯的虚焦） -->
  <g filter="url(#soft3)">
    <circle cx="1060" cy="120" r="16" fill="#5b7fb0" opacity="0.30"/>
    <circle cx="1150" cy="72" r="10" fill="#ffc978" opacity="0.25"/>
    <circle cx="1240" cy="140" r="22" fill="#3f5a86" opacity="0.28"/>
    <circle cx="1380" cy="96" r="13" fill="#ffb45f" opacity="0.22"/>
    <circle cx="1470" cy="176" r="19" fill="#4a6a99" opacity="0.24"/>
    <circle cx="1520" cy="80" r="11" fill="#ffd79a" opacity="0.20"/>
    <circle cx="980" cy="220" r="12" fill="#5b7fb0" opacity="0.20"/>
    <circle cx="1450" cy="300" r="14" fill="#ffc978" opacity="0.16"/>
  </g>

  <!-- 台灯光晕 -->
  <g filter="url(#soft)">
    <circle cx="1327" cy="300" r="270" fill="url(#lampGlow)"/>
  </g>

  <!-- 桌面 -->
  <rect x="0" y="404" width="1600" height="116" fill="url(#desk)"/>
  <path d="M0 404 H1600" stroke="#e8b877" stroke-opacity="0.15" stroke-width="2"/>

  <!-- 光束 -->
  <polygon points="1288,218 1366,218 1414,404 1240,404" fill="url(#beam)"/>
  <ellipse cx="1327" cy="404" rx="150" ry="20" fill="url(#pool)" filter="url(#soft2)"/>

  <!-- 生命体：桌上一团会呼吸的光 -->
  <g>
    <circle cx="1327" cy="352" r="98" fill="#ffb45f" opacity="0.09" filter="url(#soft)"/>
    <circle cx="1327" cy="352" r="52" fill="url(#orbCore)"/>
    <circle cx="1327" cy="352" r="52" fill="none" stroke="#ffe7c2" stroke-opacity="0.5" stroke-width="1.2"/>
    <circle cx="1327" cy="352" r="80" fill="none" stroke="#ffd79a" stroke-opacity="0.20" stroke-width="1"/>
    <circle cx="1327" cy="352" r="112" fill="none" stroke="#ffd79a" stroke-opacity="0.10" stroke-width="1"/>
    <circle cx="1308" cy="334" r="12" fill="#fffdf7" opacity="0.85" filter="url(#soft2)"/>
  </g>

  <!-- 台灯 -->
  <g>
    <path d="M1380 398 L1382 296 C1382 240 1372 198 1352 178"
          fill="none" stroke="#a8a196" stroke-width="9" stroke-linecap="round"/>
    <path d="M1310 176 L1362 176 L1374 218 L1276 218 Z" fill="#cec7b9" fill-opacity="0.95"/>
    <path d="M1310 176 L1362 176 L1374 218 L1276 218 Z" fill="none" stroke="#8d867a" stroke-width="2"/>
    <ellipse cx="1327" cy="219" rx="54" ry="7" fill="#ffe4b8" opacity="0.9" filter="url(#soft2)"/>
    <rect x="1341" y="394" width="80" height="14" rx="7" fill="#8d867a"/>
    <rect x="1341" y="394" width="80" height="14" rx="7" fill="none" stroke="#6b665c"/>
  </g>

  <!-- 文案 -->
  <g font-family="'Noto Serif SC','Songti SC','Source Han Serif SC','SimSun',Georgia,serif">
    <text x="96" y="150" fill="#f7b169" font-size="15" letter-spacing="6"
          font-family="'Inter','Segoe UI',system-ui,sans-serif">AI COMPANION · 数字生命体</text>
    <text x="92" y="242" fill="#f7f2e8" font-size="82" letter-spacing="8">念念</text>
    <text x="98" y="298" fill="#d79f5c" font-size="34" letter-spacing="9"
          font-family="'Inter','Segoe UI',Georgia,serif" font-style="italic">niannian</text>
  </g>
  <g font-family="'Inter','Segoe UI',system-ui,sans-serif">
    <text x="96" y="358" fill="#ddd6c9" font-size="23">一个有生物钟、有脾气、会成长的 AI 陪伴体</text>
    <text x="96" y="394" fill="#928b7f" font-size="17" font-style="italic">Hold someone in your heart, and they will answer.</text>
    <text x="96" y="452" fill="#8a8278" font-size="14" letter-spacing="1">规则驱动的下意识 · 只把"开口"交给大模型 · 处处可打断的状态机</text>
  </g>

  <rect width="1600" height="520" fill="url(#vig)"/>
</svg>
